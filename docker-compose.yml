# Analyse de flux IoT en temps réel : simulateur -> Kafka -> Spark Structured Streaming -> Kafka -> tableau de bord
#
#   docker compose up -d --build        démarre tout (le premier lancement télécharge les images, quelques minutes)
#   http://localhost:8501               tableau de bord
#   http://localhost:4040               interface Spark (onglet « Structured Streaming »)
#   docker compose down -v              arrête tout et efface les données (Kafka, checkpoints, archive)

name: iot-chaine-du-froid

services:

  # --- Ingestion : broker Kafka (mode KRaft, sans ZooKeeper), configuration de l'exemple officiel Apache ---
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"                       # accès depuis la machine hôte : localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-donnees:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- Création des topics (s'exécute une fois puis s'arrête) ---
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in iot-capteurs:3 iot-alertes:1 iot-stats:1 iot-rejets:1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$${t%%:*}" --partitions "$${t##*:}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # --- Source : 12 capteurs simulés ---
  simulateur:
    build: ./simulateur
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      TOPIC_CAPTEURS: "iot-capteurs"
      INTERVALLE_S: "1.0"
    restart: unless-stopped

  # --- Traitement : job Spark Structured Streaming (mode local, tous les cœurs du conteneur) ---
  spark:
    image: spark:4.1.2-java21-python3
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    user: root                       # écrit les checkpoints et l'archive dans le volume
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[*]"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2"   # connecteur Kafka, téléchargé au 1er lancement
      - "--conf"
      - "spark.jars.ivy=/tmp/.ivy2"
      - "/app/traitement_flux.py"
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
      CHEMIN_DONNEES: "/donnees"
      PYTHONUNBUFFERED: "1"
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/app:ro
      - spark-donnees:/donnees
      - ivy-cache:/tmp/.ivy2
    restart: on-failure

  # --- Visualisation : tableau de bord Streamlit ---
  dashboard:
    build: ./dashboard
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: "kafka:19092"
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  kafka-donnees:
  spark-donnees:
  ivy-cache:
